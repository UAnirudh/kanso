# Verification gate: the checks every change must pass before review.
# `verify` is the fast job (typecheck, unit tests, production build). `e2e` runs the
# Playwright acceptance suite, which is what actually pins the API status codes
# (401/403/404) and the guest/admin role boundaries. `migrations`, `docker` and
# `audit` cover the three deploy failures those two cannot see (T-015).
name: CI

on:
  # `main` only. A branch push would otherwise start a second copy of every job next to
  # the pull-request run for the same commit — including the Docker build, which is the
  # most expensive of them. Branch work is gated by the pull request below, which runs
  # against the merge ref and is what `main`'s protection blocks on.
  push:
    branches: [main]
  # Gate a branch before it merges: a pull request runs these jobs instead of
  # only finding out after the commit reaches main. Fork PRs get a read-only token and
  # no secrets, which is all this workflow uses.
  pull_request:

# Read-only. The workflow needs no repository write access and no secret: in
# particular GROQ_API_KEY is never provided, so the AI pipeline exercises the same
# labelled local-planner path a key-less deployment uses. A green run therefore says
# nothing about the model path (see T-004).
permissions:
  contents: read

# A newer push to the same ref makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as the Docker image and Render (node:22-bookworm-slim), and new
          # enough for vitest 4 -> vite 8, which requires Node 22.12+ (AGENTS.md §8).
          node-version: "22"
          cache: npm

      # `npm ci`, not `npm install`: it fails on a manifest/lockfile mismatch, which is
      # exactly the failure mode that breaks the Docker and Render builds. Catching it
      # here is cheaper than catching it in an image build.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # A separate job so the fast feedback above is never held up by a browser download.
  # The suite starts its own server on :3100 against a fresh SQLite file
  # (playwright.config.ts -> `npm run e2e:server`), so no service container is needed.
  e2e:
    name: playwright acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # The browser bundle is the largest download in this job and the one part of it that
      # `setup-node`'s npm cache cannot cover. On 2026-11-26 a stalling Ubuntu mirror turned
      # this job from 2m02s into 6m47s (run 45783219235), so keep it between runs instead of
      # re-fetching it every time. Keyed on the *installed* Playwright version, which is what
      # pins the Chromium revision `playwright install` looks for, so the key changes exactly
      # when a different bundle would be needed and never restores a mismatched browser.
      - id: playwright
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` installs the shared libraries Chromium needs on a bare runner;
      # without it the browser launches and dies on a missing .so before the first test.
      # Only chromium: playwright.config.ts defines that project alone.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # trace and screenshot are retain-on-failure / only-on-failure, so on a red run
      # this archive is the only evidence of what the browser actually saw.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  # T-015: a deploy is a schema change on top of existing data, not a fresh
  # database. Build one at 0003 with the real runner, let it apply 0004 on top,
  # then require foreign_key_check and integrity_check to pass.
  migrations:
    name: schema upgrade from previous release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: node scripts/migrate-check.mjs

  # The image is built by node:22-bookworm-slim's npm on amd64, so a lockfile or
  # native module that works on this host can still fail here — the exact Render
  # failure mode. The smoke test also writes a guest, restarts and compares rows
  # on the volume, so it covers persistence, not just `docker build`.
  docker:
    name: docker build · volume smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: bash docker/smoke-test.sh

      # The runner is disposable, but leaving the container running hides failures
      # in later steps and wastes the job's disk. The script leaves it for local
      # inspection; CI removes it either way.
      - if: always()
        run: |
          docker rm -f kanso-test >/dev/null 2>&1 || true
          docker volume rm kanso-data >/dev/null 2>&1 || true

  # A green build says nothing about a known CVE in a dependency. High and
  # critical only: gating on low advisories turns the job into noise people learn
  # to bypass.
  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm audit --audit-level=high
